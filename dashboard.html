<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — PesanRapi</title>
<meta name="description" content="Ringkasan pesanan WhatsApp harian: pesanan baru, belum bayar, siap dikirim, dan omzet hari ini.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="dashboard" class="app-body">

<div id="app-header"></div>

<main class="container" style="padding-top:20px">

  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px;">
    <div>
      <h1 style="font-size:21px;" id="greeting">Halo 👋</h1>
      <p class="text-muted" style="font-size:14px; margin-top:4px;">Ini ringkasan tokomu hari ini.</p>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 4h9l3 3v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 9h6M9 13h6M9 17h4"/></svg></div>
      <div class="stat-value" id="stat-baru">0</div>
      <div class="stat-label">Pesanan Baru</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5V12l3 2"/></svg></div>
      <div class="stat-value" id="stat-unpaid">0</div>
      <div class="stat-label">Belum Bayar</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7h11v9H3zM14 11h4l3 3v2h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg></div>
      <div class="stat-value" id="stat-ready">0</div>
      <div class="stat-label">Siap Dikirim</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6.5" width="18" height="11" rx="1.6"/><circle cx="12" cy="12" r="2.4"/></svg></div>
      <div class="stat-value" id="stat-omzet">Rp0</div>
      <div class="stat-label">Omzet Hari Ini</div>
    </div>
  </div>

  <button class="btn btn-primary btn-block" style="margin-bottom:24px;" onclick="location.href='pesanan.html?new=1'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg> Tambah Pesanan
  </button>

  <section style="margin-bottom:32px;">
    <div class="section-title">
      <h2>Pesanan perlu diproses</h2>
      <a href="pesanan.html">Lihat semua</a>
    </div>
    <div class="order-list" id="action-order-list"></div>
  </section>

</main>

<div id="app-bottomnav"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
