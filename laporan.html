<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan — PesanRapi</title>
<meta name="description" content="Ringkasan omzet, jumlah pesanan, pelanggan aktif, dan produk terlaris dalam 30 hari terakhir.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Ctext x='16' y='22' font-size='15' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="laporan" class="app-body">

<div id="app-header"></div>

<main class="container" style="padding-top:20px">

  <h1 style="font-size:21px; margin-bottom:4px;">Laporan</h1>
  <p class="text-muted" style="font-size:14px; margin-bottom:18px;">Ringkasan 30 hari terakhir</p>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6.5" width="18" height="11" rx="1.6"/><circle cx="12" cy="12" r="2.4"/></svg></div>
      <div class="stat-value" id="rep-omzet">Rp0</div>
      <div class="stat-label">Omzet 30 Hari</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 4h9l3 3v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 9h6M9 13h6M9 17h4"/></svg></div>
      <div class="stat-value" id="rep-count">0</div>
      <div class="stat-label">Jumlah Pesanan</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path stroke-linecap="round" stroke-linejoin="round" d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/></svg></div>
      <div class="stat-value" id="rep-customers">0</div>
      <div class="stat-label">Pelanggan Aktif</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="m12 3 2.5 5.5 6 .7-4.4 4 1.2 6-5.3-3-5.3 3 1.2-6-4.4-4 6-.7Z"/></svg></div>
      <div class="stat-value" id="rep-top-product" style="font-size:15px;">-</div>
      <div class="stat-label">Produk Terlaris</div>
    </div>
  </div>

  <div class="card chart-card" style="margin-bottom:20px;">
    <div class="section-title" style="margin-bottom:12px;">
      <h2 style="font-size:15.5px;">Omzet 7 Hari Terakhir</h2>
    </div>
    <canvas id="omzet-chart" height="220" role="img" aria-label="Grafik omzet 7 hari terakhir"></canvas>
  </div>

  <div class="card card-pad" style="margin-bottom:24px;">
    <div class="section-title">
      <h2 style="font-size:15.5px;">Produk Terlaris</h2>
    </div>
    <div id="top-products-list"></div>
  </div>

</main>

<div id="app-bottomnav"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/laporan.js"></script>
</body>
</html>
